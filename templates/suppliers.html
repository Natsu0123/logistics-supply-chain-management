{% extends 'base.html' %}{% block content %}<h1>Ta’minotchilar</h1><section class="panel"><h2>Yangi ta’minotchi</h2><form method="post" class="gridform"><input type="hidden" name="csrf" value="{{csrf}}"><label>Nomi<input name="name" maxlength="100" required></label><label>Telefon<input name="phone" maxlength="30" required></label><label>Shahar<input name="city" maxlength="100" required></label><button>Qo‘shish</button></form></section><section class="panel"><table><thead><tr><th>Nomi</th><th>Telefon</th><th>Shahar</th></tr></thead><tbody>{% for r in rows %}<tr><td>{{r.name}}</td><td>{{r.phone}}</td><td>{{r.city}}</td></tr>{% else %}<tr><td colspan="3">Ta’minotchi qo‘shing.</td></tr>{% endfor %}</tbody></table></section>{% endblock %}
