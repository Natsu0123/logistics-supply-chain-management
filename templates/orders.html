{% extends 'base.html' %}{% block content %}<h1>Buyurtmalar</h1><details class="panel"><summary>Yangi buyurtma</summary><form method="post"><input type="hidden" name="csrf" value="{{csrf}}"><div class="gridform"><label>Mijoz<input name="customer" maxlength="100" required></label><label>Yetkazish manzili<input name="destination" maxlength="200" required></label></div><div id="items"><div class="item"><label>Mahsulot<select name="product_id" required>{% for p in products %}<option value="{{p.id}}">{{p.name}} · {{p.stock}} dona · {{p.price|money}} so‘m</option>{% endfor %}</select></label><label>Miqdor<input name="quantity" type="number" min="1" max="1000000" value="1" required></label><button type="button" class="remove secondary">Olib tashlash</button></div></div><div class="actions"><button type="button" id="add-item" class="secondary">Yana mahsulot</button><button>Buyurtmani saqlash</button></div></form></details><section class="panel"><form class="search"><label>Holat<select name="status"><option value="">Barchasi</option>{% for s in statuses %}<option {{'selected' if selected==s else ''}}>{{s}}</option>{% endfor %}</select></label><button class="secondary">Ko‘rsatish</button></form><div class="scroll"><table><thead><tr><th>Raqam va sana UTC</th><th>Mijoz</th><th>Manzil</th><th>Summa so‘m</th><th>Holat</th></tr></thead><tbody>{% for r in rows %}<tr><td><a href="/orders/{{r.id}}">#{{r.id}}</a><br><small>{{r.created_at}}</small></td><td>{{r.customer}}</td><td>{{r.destination}}</td><td>{{r.total|money}}</td><td><span class="badge {{'red' if r.status=='Bekor qilindi' else ''}}">{{r.status}}</span></td></tr>{% else %}<tr><td colspan="5">Buyurtmalar yo‘q.</td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
